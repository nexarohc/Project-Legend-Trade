<svg width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    Three candles: one down, two up. The mark is the product itself — a price
    series with a direction — rather than an abstract glyph that could belong
    to any piece of software.
  -->
  <defs>
    <linearGradient id="ltGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3c7" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0e1118" />
  <line x1="16" y1="18" x2="16" y2="44" stroke="#ef5350" stroke-width="3" stroke-linecap="round" />
  <rect x="12" y="24" width="8" height="14" rx="1.5" fill="#ef5350" />
  <line x1="32" y1="14" x2="32" y2="46" stroke="url(#ltGrad)" stroke-width="3" stroke-linecap="round" />
  <rect x="28" y="22" width="8" height="18" rx="1.5" fill="url(#ltGrad)" />
  <line x1="48" y1="10" x2="48" y2="40" stroke="url(#ltGrad)" stroke-width="3" stroke-linecap="round" />
  <rect x="44" y="16" width="8" height="18" rx="1.5" fill="url(#ltGrad)" />
</svg>
