       only the dark terminal, and it silently defeated the theme system: `.dark`
       on <body> redefines the palette variables for every descendant, so the
       toggle could set and clear the class on <html> all it liked and nothing
       below <body> ever changed. src/lib/theme.js owns that class now, and puts
       it on <html>. -->
